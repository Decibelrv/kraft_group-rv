function canvasTex(size, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

// natural oak veneer, vertical grain (texture covers 0.6 x 0.6 m)
function oakDraw(base, seed) {
  return (g, s) => {
    g.fillStyle = base; g.fillRect(0, 0, s, s);
    const r = rng(seed);
    for (let i = 0; i < 420; i++) {
      const x = r() * s, w = 0.5 + r() * 2.5, a = 0.04 + r() * 0.12, d = r() < 0.5;
      g.strokeStyle = d ? `rgba(90,58,30,${a})` : `rgba(235,205,160,${a * 0.8})`; g.lineWidth = w;
      g.beginPath(); let xx = x; g.moveTo(xx, 0);
      for (let y = 0; y <= s; y += 16) { xx += (r() - 0.5) * 1.6; g.lineTo(xx, y); } g.stroke();
    }
    for (let k = 0; k < 6; k++) { // cathedral figure
      const cx = r() * s, cy = r() * s; g.strokeStyle = `rgba(100,65,35,${0.08 + r() * 0.08})`;
      for (let j = 1; j < 9; j++) { g.lineWidth = 1 + r(); g.beginPath(); g.ellipse(cx, cy, j * 5, j * 38, 0, 0, Math.PI * 2); g.stroke(); }
    }
  };
}
const oakTex = canvasTex(1024, oakDraw('#b48a5c', 5));

// white quartz with soft grey veins (texture covers 1.2 x 1.2 m)
const quartzTex = canvasTex(2048, (g, s) => {
  g.fillStyle = '#efede9'; g.fillRect(0, 0, s, s);
  const r = rng(21);
  for (let i = 0; i < 30000; i++) { const v = 220 + r() * 30 | 0; g.fillStyle = `rgba(${v},${v},${v - 3},0.25)`; g.fillRect(r() * s, r() * s, 2, 2); }
  g.lineCap = 'round';
  for (let k = 0; k < 9; k++) {
    let x = r() * s, y = -20, w = 1 + r() * 5;
    const pts = [[x, y]]; while (y < s + 20) { x += (r() - 0.45) * 90; y += 30 + r() * 60; pts.push([x, y]); }
    for (const [lw, a] of [[w * 4, 0.05], [w * 1.6, 0.12], [w * 0.6, 0.35]]) {
      g.strokeStyle = `rgba(120,118,115,${a})`; g.lineWidth = lw; g.beginPath(); g.moveTo(...pts[0]);
      for (const p of pts.slice(1)) g.lineTo(...p); g.stroke();
    }
  }
});

// floor: light natural oak planks, 1.8 m x 0.2 m (texture covers 1.8 x 1.8 m)
const floorTex = canvasTex(2048, (g, s) => {
  const r = rng(9), n = 9, h = s / n;
  for (let j = 0; j < n; j++) {
    const off = r() * s;
    for (const x0 of [-off, s - off]) {
      const v = r(); g.fillStyle = `rgb(${196 + v * 18 | 0},${170 + v * 16 | 0},${134 + v * 14 | 0})`;
      g.fillRect(x0, j * h, s, h);
      for (let i = 0; i < 90; i++) {
        g.strokeStyle = `rgba(${r() < 0.5 ? '120,88,55' : '240,220,190'},${0.05 + r() * 0.1})`; g.lineWidth = 0.6 + r() * 1.8;
        const y = j * h + r() * h; g.beginPath(); g.moveTo(x0, y);
        for (let x = 0; x <= s; x += 40) g.lineTo(x0 + x, y + Math.sin(x * 0.01 + i) * 2); g.stroke();
      }
      g.fillStyle = 'rgba(80,60,40,0.55)'; g.fillRect(x0 + s - 1, j * h, 2, h);
    }
    g.fillStyle = 'rgba(80,60,40,0.5)'; g.fillRect(0, j * h, s, 2);
  }
});

const hobTex = canvasTex(512, (g, s) => {
  g.fillStyle = '#060607'; g.fillRect(0, 0, s, s);
  g.strokeStyle = 'rgba(120,120,125,0.5)'; g.lineWidth = 3;
  [[0.22, 0.32, 0.14], [0.22, 0.72, 0.12], [0.55, 0.5, 0.18], [0.84, 0.32, 0.11], [0.84, 0.72, 0.11]]
    .forEach(([x, y, rr]) => { g.beginPath(); g.arc(x * s, y * s, rr * s, 0, Math.PI * 2); g.stroke(); });
  g.fillStyle = 'rgba(170,170,175,0.7)';
  for (let i = 0; i < 9; i++) g.fillRect(s * 0.3 + i * s * 0.045, s * 0.93, s * 0.02, s * 0.012);
});

// world-scaled UV box: texture tile = `tile` metres on every face
function box(x0, x1, y0, y1, z0, z1, mat, opts = {}) {
  const sx = x1 - x0, sy = y1 - y0, sz = z1 - z0;
  const geo = new THREE.BoxGeometry(sx, sy, sz);
  if (opts.tile) {
    const t = opts.tile, uv = geo.attributes.uv;
    // face order: +x,-x,+y,-y,+z,-z ; each 4 verts
    const dims = [[sz, sy], [sz, sy], [sx, sz], [sx, sz], [sx, sy], [sx, sy]];
    const o = opts.uvOff || [0, 0];
    for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {
      const i = f * 4 + v;
      let u = uv.getX(i) * dims[f][0] / t, w = uv.getY(i) * dims[f][1] / t;
      if (f === 4 || f === 5) { u += x0 / t; w += y0 / t; }
      uv.setXY(i, u + o[0], w + o[1]);
    }
  }
  const m = new THREE.Mesh(geo, mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = opts.cast !== false; m.receiveShadow = true;
  scene.add(m); return m;
}

  for (let i = 0; i < 40; i++) { const l = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 6), leafM); l.scale.set(1, 0.3, 0.6); const a = r() * 6.28, rr = 0.05 + r() * 0.16; l.position.set(2.75 + Math.cos(a) * rr * 0.7, TOP + 0.35 + r() * 0.35, PZ - 0.05 + Math.sin(a) * rr * 0.5); l.rotation.set(r() * 3, r() * 3, r() * 3); l.castShadow = true; scene.add(l); }
  // worktop: board + oil bottles
  box(0.08, 0.48, TOP, TOP + 0.02, 0.03, 0.33, M.oak, { tile: 0.6 }).rotation.x = -0.12;
  const oilM = new THREE.MeshPhysicalMaterial({ color: 0x6b5a2a, roughness: 0.1, transparent: true, opacity: 0.8 });
  [0, 0.07].forEach((dx, i) => { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.2 - i * 0.03, 24), oilM); b.position.set(1.65 + dx, TOP + 0.1 - i * 0.015, 0.1); b.castShadow = true; scene.add(b); });
}

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0xfffaf2, 0xe0d6c8, 0.9));
const sun = new THREE.DirectionalLight(0xfff0dd, 3.0);   // daylight from a window behind-left of the camera
sun.position.set(-3.5, 3.6, 6.5); sun.target.position.set(2.2, 0.6, 0.8); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 8; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 20 });
scene.add(sun);
for (const [x, z] of [[0.7, 0.95], [2.0, 0.95], [3.4, 1.1], [1.0, 3.6], [3.2, 3.6]]) {
  const sp = new THREE.SpotLight(0xfff0dc, 2.2, 6, Math.PI / 3.2, 0.8, 1.6);
  sp.position.set(x, CEIL - 0.02, z); sp.target.position.set(x, 0, z - 0.3); scene.add(sp, sp.target);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(0.04, 24), M.led); disc.rotation.x = Math.PI / 2; disc.position.set(x, CEIL - 0.001, z); scene.add(disc);
}
const fill = new THREE.RectAreaLight(0xffffff, 0.5, 4.5, 2.6); fill.position.set(2.1, 1.5, 7); fill.lookAt(2.1, 1.2, 0); scene.add(fill);

// ---------- camera ----------
const cam = new THREE.PerspectiveCamera(46, W / H, 0.05, 50);
if (VIEW === 'side') { cam.position.set(0.4, 1.6, 4.6); cam.lookAt(2.6, 1.15, 0.8); }
else { cam.position.set(1.9, 1.78, 7.0); cam.lookAt(2.08, 1.3, 0.6); }
cam.updateProjectionMatrix();

renderer.render(scene, cam);
window.__done = true;
