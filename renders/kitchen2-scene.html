<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/","three-gpu-pathtracer":"./node_modules/three-gpu-pathtracer/build/index.module.js","three-mesh-bvh":"./node_modules/three-mesh-bvh/build/index.module.js"}}</script>

<script type="module">
// Kitchen proposal for a 4170 x 2770 mm wall with a wall-hung gas boiler at the top left.
// Straight run over the whole wall: base + uppers to ceiling (boiler hidden in the left upper), oven under the hob,
// built-in microwave in the last upper, recirculating hood. No tall columns, no island.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 2400), H = +(q.get('h') || 1600);
const VIEW = q.get('view') || 'main';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const ENV = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environment = ENV; scene.environmentIntensity = 0.35;
scene.background = new THREE.Color(0xe9e6e1);

// ---------- textures ----------
function canvasTex(size, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

// natural oak veneer, vertical grain (texture covers 0.6 x 0.6 m)
function oakDraw(base, seed) {
  return (g, s) => {
    g.fillStyle = base; g.fillRect(0, 0, s, s);
    const r = rng(seed);
    for (let i = 0; i < 420; i++) {
      const x = r() * s, w = 0.5 + r() * 2.5, a = 0.04 + r() * 0.12, d = r() < 0.5;
      g.strokeStyle = d ? `rgba(90,58,30,${a})` : `rgba(235,205,160,${a * 0.8})`; g.lineWidth = w;
      g.beginPath(); let xx = x; g.moveTo(xx, 0);
      for (let y = 0; y <= s; y += 16) { xx += (r() - 0.5) * 1.6; g.lineTo(xx, y); } g.stroke();
    }
    for (let k = 0; k < 6; k++) { // cathedral figure
      const cx = r() * s, cy = r() * s; g.strokeStyle = `rgba(100,65,35,${0.08 + r() * 0.08})`;
      for (let j = 1; j < 9; j++) { g.lineWidth = 1 + r(); g.beginPath(); g.ellipse(cx, cy, j * 5, j * 38, 0, 0, Math.PI * 2); g.stroke(); }
    }
  };
}
const oakTex = canvasTex(1024, oakDraw('#b48a5c', 5));

// white quartz with soft grey veins (texture covers 1.2 x 1.2 m)
const quartzTex = canvasTex(2048, (g, s) => {
  g.fillStyle = '#efede9'; g.fillRect(0, 0, s, s);
  const r = rng(21);
  for (let i = 0; i < 30000; i++) { const v = 220 + r() * 30 | 0; g.fillStyle = `rgba(${v},${v},${v - 3},0.25)`; g.fillRect(r() * s, r() * s, 2, 2); }
  g.lineCap = 'round';
  for (let k = 0; k < 9; k++) {
    let x = r() * s, y = -20, w = 1 + r() * 5;
    const pts = [[x, y]]; while (y < s + 20) { x += (r() - 0.45) * 90; y += 30 + r() * 60; pts.push([x, y]); }
    for (const [lw, a] of [[w * 4, 0.05], [w * 1.6, 0.12], [w * 0.6, 0.35]]) {
      g.strokeStyle = `rgba(120,118,115,${a})`; g.lineWidth = lw; g.beginPath(); g.moveTo(...pts[0]);
      for (const p of pts.slice(1)) g.lineTo(...p); g.stroke();
    }
  }
});

// floor: light natural oak planks, 1.8 m x 0.2 m (texture covers 1.8 x 1.8 m)
const floorTex = canvasTex(2048, (g, s) => {
  const r = rng(9), n = 9, h = s / n;
  for (let j = 0; j < n; j++) {
    const off = r() * s;
    for (const x0 of [-off, s - off]) {
      const v = r(); g.fillStyle = `rgb(${196 + v * 18 | 0},${170 + v * 16 | 0},${134 + v * 14 | 0})`;
      g.fillRect(x0, j * h, s, h);
      for (let i = 0; i < 90; i++) {
        g.strokeStyle = `rgba(${r() < 0.5 ? '120,88,55' : '240,220,190'},${0.05 + r() * 0.1})`; g.lineWidth = 0.6 + r() * 1.8;
        const y = j * h + r() * h; g.beginPath(); g.moveTo(x0, y);
        for (let x = 0; x <= s; x += 40) g.lineTo(x0 + x, y + Math.sin(x * 0.01 + i) * 2); g.stroke();
      }
      g.fillStyle = 'rgba(80,60,40,0.55)'; g.fillRect(x0 + s - 1, j * h, 2, h);
    }
    g.fillStyle = 'rgba(80,60,40,0.5)'; g.fillRect(0, j * h, s, 2);
  }
});

const hobTex = canvasTex(512, (g, s) => {
  g.fillStyle = '#060607'; g.fillRect(0, 0, s, s);
  g.strokeStyle = 'rgba(120,120,125,0.5)'; g.lineWidth = 3;
  [[0.22, 0.32, 0.14], [0.22, 0.72, 0.12], [0.55, 0.5, 0.18], [0.84, 0.32, 0.11], [0.84, 0.72, 0.11]]
    .forEach(([x, y, rr]) => { g.beginPath(); g.arc(x * s, y * s, rr * s, 0, Math.PI * 2); g.stroke(); });
  g.fillStyle = 'rgba(170,170,175,0.7)';
  for (let i = 0; i < 9; i++) g.fillRect(s * 0.3 + i * s * 0.045, s * 0.93, s * 0.02, s * 0.012);
});

// ---------- materials ----------
const M = {
  cash: new THREE.MeshPhysicalMaterial({ color: 0xd9cfc2, roughness: 0.62, sheen: 0.2, sheenColor: 0xffffff }),
  oak: new THREE.MeshStandardMaterial({ map: oakTex, roughness: 0.55 }),
  carcass: new THREE.MeshStandardMaterial({ color: 0xbdb5aa, roughness: 0.6 }),
  quartz: new THREE.MeshPhysicalMaterial({ map: quartzTex, roughness: 0.14, clearcoat: 0.5, clearcoatRoughness: 0.1 }),
  gola: new THREE.MeshStandardMaterial({ color: 0x0c0c0c, roughness: 0.45, metalness: 0.6 }),
  plinth: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6, metalness: 0.3 }),
  wall: new THREE.MeshStandardMaterial({ color: 0xeeebe6, roughness: 0.92 }),
  ceiling: new THREE.MeshStandardMaterial({ color: 0xf6f5f2, roughness: 0.95 }),
  floor: new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.42 }),
  blackGlass: new THREE.MeshPhysicalMaterial({ color: 0x050506, roughness: 0.04, metalness: 0.1, clearcoat: 1 }),
  hob: new THREE.MeshPhysicalMaterial({ map: hobTex, roughness: 0.05, clearcoat: 1 }),
  matteBlack: new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.45, metalness: 0.5 }),
  sinkBlack: new THREE.MeshStandardMaterial({ color: 0x18181a, roughness: 0.65 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xb9bcbf, roughness: 0.25, metalness: 1 }),
  led: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xfff1d6, emissiveIntensity: 4 }),
  display: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffb35c, emissiveIntensity: 2 }),
  displayW: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xdfefff, emissiveIntensity: 2 }),
  socket: new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.5 }),
};
for (const [k, v] of Object.entries(M)) v.name = k;
for (const [k, v] of [['quartz', 1.0], ['blackGlass', 1.6], ['hob', 1.4], ['steel', 1.5], ['matteBlack', 1.0], ['floor', 0.7], ['oak', 0.5], ['cash', 0.4]]) { M[k].envMap = ENV; M[k].envMapIntensity = v; }

// world-scaled UV box: texture tile = `tile` metres on every face
function box(x0, x1, y0, y1, z0, z1, mat, opts = {}) {
  const sx = x1 - x0, sy = y1 - y0, sz = z1 - z0;
  const geo = new THREE.BoxGeometry(sx, sy, sz);
  if (opts.tile) {
    const t = opts.tile, uv = geo.attributes.uv;
    // face order: +x,-x,+y,-y,+z,-z ; each 4 verts
    const dims = [[sz, sy], [sz, sy], [sx, sz], [sx, sz], [sx, sy], [sx, sy]];
    const o = opts.uvOff || [0, 0];
    for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {
      const i = f * 4 + v;
      let u = uv.getX(i) * dims[f][0] / t, w = uv.getY(i) * dims[f][1] / t;
      if (f === 4 || f === 5) { u += x0 / t; w += y0 / t; }
      uv.setXY(i, u + o[0], w + o[1]);
    }
  }
  const m = new THREE.Mesh(geo, mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = opts.cast !== false; m.receiveShadow = true;
  scene.add(m); return m;
}
const G = 0.0035; // door gap
const oakT = { tile: 0.6 }, qT = { tile: 1.2 };

// ---------- room ----------
const L = 4.17, CEIL = 2.77;
{
  const geo = new THREE.PlaneGeometry(12, 12); const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 12 / 1.8, uv.getY(i) * 12 / 1.8);
  const f = new THREE.Mesh(geo, M.floor); f.rotation.x = -Math.PI / 2; f.position.set(2, 0, 4); f.receiveShadow = true; scene.add(f);
}
box(-0.1, L + 0.1, 0, CEIL, -0.1, 0, M.wall, { cast: false });            // kitchen wall
box(-0.1, 0, 0, CEIL, 0, 8, M.wall, { cast: false });                     // left wall
box(L, L + 0.1, 0, CEIL, 0, 1.35, M.wall, { cast: false });                // right wall up to the opening
box(L, L + 0.1, 2.3, CEIL, 1.35, 2.35, M.wall, { cast: false });           // lintel over the opening
box(L, L + 0.1, 0, CEIL, 2.35, 8, M.wall, { cast: false });
box(L + 0.1, L + 2, 0, CEIL, 1.25, 1.35, M.wall, { cast: false });         // reveal / next room
box(-0.1, L + 2, CEIL, CEIL + 0.05, -0.1, 8, M.ceiling, { cast: false });

// ---------- base run x 0..2.97 ----------
const BX = L, TOP = 0.9;   // one straight run along the whole 4170 mm wall (no tall columns, no island)
box(0, BX, 0, 0.1, 0, 0.54, M.plinth);
box(0, BX, 0.1, 0.86, 0, 0.58, M.carcass);
box(0, BX, 0.80, 0.86, 0.53, 0.585, M.gola);                 // top Gola for the whole run
const drawers = (x0, x1) => {
  box(x0 + G, x1 - G, 0.1, 0.40, 0.58, 0.6, M.cash);
  box(x0, x1, 0.40, 0.46, 0.53, 0.585, M.gola);
  box(x0 + G, x1 - G, 0.46, 0.80, 0.58, 0.6, M.cash);
};
// 0..1.2: doors only - boiler pipework, main water valve + filter (valve ~1060 mm from the left wall)
box(0 + G, 0.6 - G, 0.1, 0.80, 0.58, 0.6, M.cash);
box(0.6 + G, 1.2 - G, 0.1, 0.80, 0.58, 0.6, M.cash);
drawers(1.2, 1.77);
box(1.77 + G, 2.07 - G, 0.1, 0.80, 0.58, 0.6, M.cash);         // sink base, two doors (supply/drain ~2.2 m)
box(2.07 + G, 2.37 - G, 0.1, 0.80, 0.58, 0.6, M.cash);
box(2.37 + G, 2.97 - G, 0.1, 0.80, 0.58, 0.6, M.cash);         // integrated dishwasher
// 2.97..3.57: built-in oven under the hob
box(2.97 + G, 3.57 - G, 0.1, 0.19, 0.58, 0.6, M.cash);
{ const x0 = 2.97 + G, x1 = 3.57 - G, y0 = 0.195, y1 = 0.79;
  box(x0, x1, y0, y1, 0.58, 0.602, M.blackGlass);
  box(x0 + 0.05, x1 - 0.05, y1 - 0.075, y1 - 0.06, 0.602, 0.632, M.steel);
  box(x0 + 0.26, x0 + 0.34, y1 - 0.04, y1 - 0.02, 0.602, 0.6035, M.display, { cast: false }); }
drawers(3.57, BX);

// quartz worktop with undermount sink and full-height quartz backsplash
const SX0 = 1.84, SX1 = 2.30, SZ0 = 0.1, SZ1 = 0.5;
box(0, SX0, 0.86, TOP, 0, 0.62, M.quartz, qT);
box(SX1, BX, 0.86, TOP, 0, 0.62, M.quartz, qT);
box(SX0, SX1, 0.86, TOP, 0, SZ0, M.quartz, qT);
box(SX0, SX1, 0.86, TOP, SZ1, 0.62, M.quartz, qT);
box(0, BX, TOP, 1.5, 0, 0.012, M.quartz, qT);
// sink bowl
box(SX0, SX1, 0.67, 0.68, SZ0, SZ1, M.sinkBlack);
for (const [a, b, c, d] of [[SX0, SX0 + 0.01, SZ0, SZ1], [SX1 - 0.01, SX1, SZ0, SZ1], [SX0, SX1, SZ0, SZ0 + 0.01], [SX0, SX1, SZ1 - 0.01, SZ1]])
  box(a, b, 0.67, 0.86, c, d, M.sinkBlack);
// black faucet
{
  const fx = (SX0 + SX1) / 2, fz = 0.07;
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.026, 0.06, 32), M.matteBlack);
  base.position.set(fx, TOP + 0.03, fz); base.castShadow = true; scene.add(base);
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(fx, TOP + 0.05, fz), new THREE.Vector3(fx, TOP + 0.3, fz), new THREE.Vector3(fx, TOP + 0.38, fz + 0.06),
    new THREE.Vector3(fx, TOP + 0.37, fz + 0.16), new THREE.Vector3(fx, TOP + 0.3, fz + 0.21), new THREE.Vector3(fx, TOP + 0.22, fz + 0.215)]);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.013, 20), M.matteBlack); tube.castShadow = true; scene.add(tube);
}
// black glass hob 600 mm over the oven
{ const hx = 3.27, hz = 0.32; box(hx - 0.295, hx + 0.295, TOP, TOP + 0.006, hz - 0.26, hz + 0.26, M.hob); }
// black sockets on the backsplash (kept 300+ mm clear of the hob)
for (const [x, n] of [[1.4, 2], [2.55, 2], [3.82, 2]]) for (let i = 0; i < n; i++) box(x + i * 0.085, x + i * 0.085 + 0.08, 1.08, 1.16, 0.012, 0.022, M.socket, { cast: false });

// ---------- uppers x 0..4.17, to the ceiling ----------
const UY0 = 1.5, UW = (BX - 0.6) / 6;
box(0, BX, UY0, CEIL, 0, 0.35, M.carcass);
// left 600: boiler cabinet (open bottom + vent slot at the top)
box(G, 0.6 - G, UY0 + 0.04, CEIL - 0.05, 0.35, 0.37, M.cash);
box(0, 0.6, CEIL - 0.045, CEIL, 0.34, 0.36, M.plinth, { cast: false });
box(0, 0.6, UY0, UY0 + 0.04, 0.33, 0.37, M.gola);
// six doors; #5 over the hob hides a recirculating hood (the wall opening is a sewer stack, no duct)
for (let i = 0; i < 6; i++) {
  const a = 0.6 + i * UW;
  if (i === 5) { // built-in microwave at the bottom of the last upper, door above it
    box(a + G, a + UW - G, UY0, UY0 + 0.38, 0.35, 0.372, M.blackGlass);
    box(a + UW - 0.12, a + UW - 0.05, UY0 + 0.3, UY0 + 0.32, 0.372, 0.374, M.displayW, { cast: false });
    box(a + 0.04, a + 0.44, UY0 + 0.04, UY0 + 0.05, 0.372, 0.392, M.steel);
    box(a + G, a + UW - G, UY0 + 0.385, CEIL - G, 0.35, 0.37, M.cash);
  } else box(a + G, a + UW - G, UY0 + 0.04, CEIL - G, 0.35, 0.37, M.cash);
}
box(0.6, 0.6 + 5 * UW, UY0, UY0 + 0.04, 0.33, 0.37, M.gola);   // bottom handle profile
box(0.6 + 4 * UW + 0.02, 0.6 + 5 * UW - 0.02, UY0 - 0.04, UY0, 0.02, 0.35, M.matteBlack);   // hood
box(0.62, BX - 0.03, UY0 - 0.004, UY0, 0.04, 0.055, M.led, { cast: false });
{ const ra = new THREE.RectAreaLight(0xffe7c4, 6, 3.6, 0.04); ra.position.set(2.1, UY0 - 0.01, 0.06); ra.lookAt(2.1, 0, 0.14); scene.add(ra); }

// ---------- pendants (three black tubes, as already hung on site) ----------
const PZ = 2.125;
for (const x of [1.25, 2.085, 2.92]) {
  const bottom = 1.95, h = 0.32;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, h, 32), M.matteBlack);
  body.position.set(x, bottom + h / 2, PZ); body.castShadow = true; scene.add(body);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.031, 0.031, 0.004, 32), M.led); ring.position.set(x, bottom - 0.001, PZ); scene.add(ring);
  const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.002, 0.002, CEIL - bottom - h, 6), M.matteBlack);
  cable.position.set(x, (CEIL + bottom + h) / 2, PZ); scene.add(cable);
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.02, 24), M.matteBlack); cup.position.set(x, CEIL - 0.01, PZ); scene.add(cup);
  const sp = new THREE.SpotLight(0xffe2bc, 2.2, 3, Math.PI / 7, 0.6, 1.5);
  sp.position.set(x, bottom - 0.01, PZ); sp.target.position.set(x, 0, PZ); scene.add(sp, sp.target);
}

// ---------- decor ----------
{
  const r = rng(11);
  // oak board + oil bottles left of the sink, small plant at the right end
  box(0.75, 1.15, TOP, TOP + 0.02, 0.03, 0.33, M.oak, { tile: 0.6 }).rotation.x = -0.12;
  const oilM = new THREE.MeshPhysicalMaterial({ color: 0x6b5a2a, roughness: 0.1, transparent: true, opacity: 0.8 });
  [0, 0.07].forEach((dx, i) => { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.2 - i * 0.03, 24), oilM); b.position.set(1.4 + dx, TOP + 0.1 - i * 0.015, 0.1); b.castShadow = true; scene.add(b); });
  const vase = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.065, 0.24, 32), new THREE.MeshStandardMaterial({ color: 0xe8e2d8, roughness: 0.7 }));
  vase.position.set(3.98, TOP + 0.12, 0.2); vase.castShadow = true; scene.add(vase);
  const leafM = new THREE.MeshStandardMaterial({ color: 0x55703f, roughness: 0.7 });
  for (let i = 0; i < 40; i++) { const l = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 6), leafM); l.scale.set(1, 0.3, 0.6); const a = r() * 6.28, rr = 0.04 + r() * 0.13; l.position.set(3.98 + Math.cos(a) * rr * 0.6, TOP + 0.28 + r() * 0.3, 0.2 + Math.sin(a) * rr * 0.5); l.rotation.set(r() * 3, r() * 3, r() * 3); l.castShadow = true; scene.add(l); }
}

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0xfffaf2, 0xe0d6c8, 0.9));
const sun = new THREE.DirectionalLight(0xfff0dd, 3.0);   // daylight from a window behind-left of the camera
sun.position.set(-3.5, 3.6, 6.5); sun.target.position.set(2.2, 0.6, 0.8); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 8; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 20 });
scene.add(sun);
for (const [x, z] of [[0.7, 0.95], [2.0, 0.95], [3.4, 1.1], [1.0, 3.6], [3.2, 3.6]]) {
  const sp = new THREE.SpotLight(0xfff0dc, 2.2, 6, Math.PI / 3.2, 0.8, 1.6);
  sp.position.set(x, CEIL - 0.02, z); sp.target.position.set(x, 0, z - 0.3); scene.add(sp, sp.target);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(0.04, 24), M.led); disc.rotation.x = Math.PI / 2; disc.position.set(x, CEIL - 0.001, z); scene.add(disc);
}
const fill = new THREE.RectAreaLight(0xffffff, 0.5, 4.5, 2.6); fill.position.set(2.1, 1.5, 7); fill.lookAt(2.1, 1.2, 0); scene.add(fill);

// ---------- camera ----------
const cam = new THREE.PerspectiveCamera(46, W / H, 0.05, 50);
if (VIEW === 'side') { cam.position.set(0.55, 1.6, 3.3); cam.lookAt(2.9, 1.15, 0.2); }
else { cam.position.set(2.085, 1.6, 5.3); cam.lookAt(2.085, 1.3, 0.3); }
cam.updateProjectionMatrix();

// ?pt=<samples> renders with the path tracer (global illumination, soft shadows, real reflections)
const PT = +(q.get('pt') || 0);
if (PT) {
  const { WebGLPathTracer } = await import('three-gpu-pathtracer');
  const tracer = new WebGLPathTracer(renderer);
  tracer.tiles.set(3, 3);
  tracer.bounces = +(q.get('bounces') || 5);
  tracer.filterGlossyFactor = 0.5;
  tracer.minSamples = 1;
  tracer.renderToCanvas = true;
  tracer.setScene(scene, cam);
  const t0 = performance.now();
  while (tracer.samples < PT) { tracer.renderSample(); if ((tracer.samples | 0) % 4 === 0) await new Promise(r => setTimeout(r)); }
  console.log('samples', tracer.samples, 'sec', ((performance.now() - t0) / 1000).toFixed(1));
} else if (q.get('export')) {
  // ?export=1 -> GLB of the scene + camera for the Blender/Cycles photo render (renders/blender_render.py)
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  cam.name = 'Camera'; scene.add(cam);
  const glb = await new GLTFExporter().parseAsync(scene, { binary: true, onlyVisible: true, maxTextureSize: 2048 });
  let bin = ''; const u8 = new Uint8Array(glb);
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode(...u8.subarray(i, i + 0x8000));
  window.__glb = btoa(bin);
} else {
  renderer.render(scene, cam);
}
window.__done = true;
</script></body></html>
