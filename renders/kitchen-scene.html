function canvasTex(size, draw, repX = 1, repY = 1, srgb = true) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repX, repY);
  t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

// black stone countertop: deep black with fine sparkle + faint veins
const stoneTex = canvasTex(1024, (g, s) => {
  g.fillStyle = '#0d0d0e'; g.fillRect(0, 0, s, s);
  const r = rng(7);
  for (let i = 0; i < 26000; i++) {
    const v = 18 + r() * 40 | 0; g.fillStyle = `rgba(${v},${v},${v + 2},${0.5 + r() * 0.5})`;
    g.fillRect(r() * s, r() * s, 1 + r() * 2, 1 + r() * 2);
  }
  for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(140,140,145,${0.25 + r() * 0.4})`; g.fillRect(r() * s, r() * s, 1, 1); }
  g.lineCap = 'round';
  for (let k = 0; k < 7; k++) {
    g.strokeStyle = `rgba(70,70,74,${0.10 + r() * 0.12})`; g.lineWidth = 0.6 + r() * 1.6;
    g.beginPath(); let x = r() * s, y = 0; g.moveTo(x, y);
    while (y < s) { x += (r() - 0.5) * 40; y += 10 + r() * 30; g.lineTo(x, y); } g.stroke();
  }
}, 2, 2);

// cement-tile backsplash (black / white / grey pinwheel, like the sketch)
const tileTex = canvasTex(512, (g, s) => {
  const n = 4, c = s / n;
  g.fillStyle = '#dcdcd8'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x = i * c, y = j * c;
    g.save(); g.translate(x + c / 2, y + c / 2); g.rotate(((i + j) % 2) * Math.PI / 2);
    // grey quarter discs in corners
    g.fillStyle = '#9a9a96';
    for (let q = 0; q < 4; q++) { g.save(); g.rotate(q * Math.PI / 2); g.beginPath(); g.moveTo(-c/2, -c/2); g.arc(-c/2, -c/2, c * 0.28, 0, Math.PI / 2); g.closePath(); g.fill(); g.restore(); }
    // black pinwheel petals (lens shapes)
    g.fillStyle = '#1b1b1b';
    for (let q = 0; q < 4; q++) {
      g.save(); g.rotate(q * Math.PI / 2);
      g.beginPath(); g.moveTo(0, 0);
      g.quadraticCurveTo(c * 0.42, -c * 0.06, c * 0.5, -c * 0.5);
      g.quadraticCurveTo(c * 0.06, -c * 0.42, 0, 0); g.fill();
      g.restore();
    }
    g.fillStyle = '#f2f2ee'; g.beginPath(); g.arc(0, 0, c * 0.06, 0, Math.PI * 2); g.fill();
    g.restore();
    g.strokeStyle = 'rgba(120,120,115,0.9)'; g.lineWidth = 2; g.strokeRect(x, y, c, c);
  }
}, 1, 1);

// floor: large light grey porcelain
const floorTex = canvasTex(1024, (g, s) => {
  const r = rng(3);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 4; j++) {
    const v = 168 + r() * 10 | 0; g.fillStyle = `rgb(${v},${v - 3},${v - 8})`;
    g.fillRect(i * s / 2, j * s / 4, s / 2, s / 4);
  }
  for (let k = 0; k < 40000; k++) { const v = 170 + r() * 60 | 0; g.fillStyle = `rgba(${v},${v - 2},${v - 6},0.12)`; g.fillRect(r() * s, r() * s, 2, 2); }
  g.strokeStyle = '#a7a39c'; g.lineWidth = 3;
  for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * s / 2, 0); g.lineTo(i * s / 2, s); g.stroke(); }
  for (let j = 0; j <= 4; j++) { g.beginPath(); g.moveTo(0, j * s / 4); g.lineTo(s, j * s / 4); g.stroke(); }
}, 1, 1);

  g.fillStyle = '#060607'; g.fillRect(0, 0, s, s);
  g.strokeStyle = 'rgba(120,120,125,0.55)'; g.lineWidth = 3;
  [[0.28, 0.3, 0.17], [0.72, 0.3, 0.13], [0.28, 0.72, 0.13], [0.72, 0.72, 0.17]].forEach(([x, y, rr]) => { g.beginPath(); g.arc(x * s, y * s, rr * s, 0, Math.PI * 2); g.stroke(); });
  g.fillStyle = 'rgba(170,170,175,0.7)';
  for (let i = 0; i < 9; i++) g.fillRect(s * 0.3 + i * s * 0.045, s * 0.93, s * 0.02, s * 0.012);
}, 1, 1, true);

// box from extents
function box(x0, x1, y0, y1, z0, z1, mat, opts = {}) {
  const geo = opts.round
    ? new RoundedBoxGeometry(x1 - x0, y1 - y0, z1 - z0, 2, opts.round)
    : new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  const m = new THREE.Mesh(geo, mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = opts.cast !== false; m.receiveShadow = true;
  scene.add(m); return m;
}
// tile plane with world-scaled UVs (tile 0.15 m -> texture covers 4 tiles = 0.6 m)
function tilePlane(w, h, pos, rotY) {
  const geo = new THREE.PlaneGeometry(w, h);
  const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / 0.6, uv.getY(i) * h / 0.6);
  const m = new THREE.Mesh(geo, M.tile); m.position.copy(pos); m.rotation.y = rotY; m.receiveShadow = true; scene.add(m); return m;
}

      const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.8, h, 24, 1, true), glassObj);
      c.position.set(3.3 + (j % 2) * 0.1, y + h / 2, zA + 0.11 + j * 0.14); scene.add(c);
    }
  }
  // door: graphite glass + black frame
  const fz0 = zA + G, fz1 = zB - G, fx0 = 2.978, fx1 = 3.0, f = 0.022;
  box(fx0, fx1, y0, y0 + f, fz0, fz1, M.alu);
  box(fx0, fx1, y1 - G - f, y1 - G, fz0, fz1, M.alu);
  box(fx0, fx1, y0, y1 - G, fz0, fz0 + f, M.alu);
  box(fx0, fx1, y0, y1 - G, fz1 - f, fz1, M.alu);
  box(2.986, 2.99, y0 + f, y1 - G - f, fz0 + f, fz1 - f, M.glass, { cast: false });
}

// ---------- decor ----------
{
  // cutting board + small plant on worktop
  box(1.55, 1.95, 0.9, 0.92, 0.04, 0.32, new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.6 }), { round: 0.006 }).rotation.x = -0.08;
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.12, 32), new THREE.MeshStandardMaterial({ color: 0xe6e2da, roughness: 0.7 }));
  pot.position.set(3.3, 0.96, 0.22); pot.castShadow = true; scene.add(pot);
  const leafM = new THREE.MeshStandardMaterial({ color: 0x3f6b3a, roughness: 0.7 });
  const r = rng(11);
  for (let i = 0; i < 28; i++) {

    l.rotation.set(r() * 3, r() * 3, r() * 3); l.castShadow = true; scene.add(l);
  }
  // kettle-ish bottle set
  const oilM = new THREE.MeshPhysicalMaterial({ color: 0x6b5a2a, roughness: 0.1, transparent: true, opacity: 0.8 });
  [0, 0.07].forEach((dx, i) => { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.2 - i * 0.03, 24), oilM); b.position.set(1.42 + dx, 1.0 - i * 0.015, 0.1); b.castShadow = true; scene.add(b); });
}

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0xfffaf2, 0x9d978d, 0.25));
const sun = new THREE.DirectionalLight(0xfff1e0, 3.6);
sun.position.set(-2.2, 3.2, 4.6); sun.target.position.set(1.8, 0.8, 0.4); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 6; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 15 });
scene.add(sun);
// ceiling downlights
for (const [x, z] of [[0.8, 1.2], [2.0, 1.2], [2.4, 2.4], [1.0, 2.6]]) {
  const sp = new THREE.SpotLight(0xfff0dc, 3, 6, Math.PI / 3.2, 0.8, 1.6);
  sp.position.set(x, CEIL - 0.02, z); sp.target.position.set(x, 0, z - 0.3); scene.add(sp, sp.target);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(0.04, 24), M.led); disc.rotation.x = Math.PI / 2; disc.position.set(x, CEIL - 0.001, z); scene.add(disc);
}
// soft fill from camera side
const fill = new THREE.RectAreaLight(0xffffff, 0.35, 4, 2.4); fill.position.set(1.6, 1.5, 5.5); fill.lookAt(1.6, 1.2, 0); scene.add(fill);

// ---------- camera ----------
const cam = new THREE.PerspectiveCamera(44, W / H, 0.05, 50);
if (VIEW === 'side') { cam.position.set(0.3, 1.5, 3.9); cam.lookAt(2.6, 1.2, 1.2); }
else { cam.position.set(0.75, 1.45, 5.7); cam.lookAt(1.75, 1.3, 1.0); }
